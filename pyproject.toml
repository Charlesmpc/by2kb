[project]
name = "by2kb"
version = "0.1.0"
description = "Forward a video. Keep the knowledge. Bilibili/YouTube to knowledge base."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
asr-doubao = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
by2kb = "by2kb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["by2kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
